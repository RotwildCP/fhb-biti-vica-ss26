name: "Deploy Infrastruktur"

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TF_VAR_exoscale_api_key: ${{ secrets.EXOSCALE_API_KEY }}
      TF_VAR_exoscale_api_secret: ${{ secrets.EXOSCALE_API_SECRET }}
      TF_WORKING_DIR: ./Prieller_Christian/Abgabe_2/terraform

    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1

      - name: Terraform Init & Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tofu init
          tofu apply -auto-approve

      - name: Outputs anzeigen
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tofu output -no-color

      - name: State sichern
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-state
          path: ${{ env.TF_WORKING_DIR }}/terraform.tfstate
          overwrite: true
